name: Daily Cloudflare Worker Deployment

on:
  schedule:
    - cron: '27 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-slim
    name: Deploy to Cloudflare Workers
    steps:
      - name: Deploy to Cloudflare Workers
        run: curl -X POST "${deploy_hook}"
        env:
          deploy_hook: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
